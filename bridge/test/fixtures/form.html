<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OOPIF fixture — form</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
      label { display: block; margin: 8px 0; }
      input, select { display: block; width: 260px; padding: 4px; }
      #step2 { display: none; }
      #result { font-family: ui-monospace, monospace; white-space: pre-wrap; color: #166534; }
    </style>
  </head>
  <body>
    <form id="form">
      <div id="step1">
        <label>First name <input name="first" required /></label>
        <label>Last name <input name="last" required /></label>
        <label>Email <input name="email" type="email" required /></label>
        <button type="button" id="continue">Continue</button>
      </div>
      <div id="step2">
        <label>Source
          <select name="source">
            <option value="">Select one</option>
            <option value="linkedin">LinkedIn</option>
            <option value="referral">
              Referral
            </option>
            <option value="website">Company website</option>
          </select>
        </label>
        <!-- Hidden input behind a styled button, copied from real ATS forms
             (Greenhouse etc): invisible to the user AND the accessibility tree,
             which is why the upload tool searches the DOM for it instead of
             taking a ref like every other tool does. The button itself does
             nothing — real forms wire its click to the input, this one doesn't
             need to for the tool to find it. -->
        <input type="file" id="resume" name="resume" style="display: none" />
        <button type="button">Attach resume</button>
        <button type="submit">Submit Application</button>
      </div>
    </form>
    <pre id="result"></pre>

    <script>
      const result = document.getElementById("result");
      // keydown, not input: proves the keystrokes were trusted CDP key events and
      // not a value assignment, which is the whole reason for Input.dispatchKeyEvent.
      let keys = 0;
      addEventListener("keydown", () => keys++);

      // The same page with one label changed, for a saved skill to heal on:
      // set localStorage.relabel on this origin and "Continue" reads "Next".
      try {
        if (localStorage.getItem("relabel")) document.getElementById("continue").textContent = "Next";
      } catch {}

      document.getElementById("continue").addEventListener("click", () => {
        document.getElementById("step1").style.display = "none";
        document.getElementById("step2").style.display = "block";
      });

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        // FormData hands back the File object under "resume"; a name is what a
        // human and a self-test can both read back out of the JSON below.
        data.resume = document.getElementById("resume").files[0]?.name ?? null;
        result.textContent = `submitted after ${keys} keydowns\n${JSON.stringify(data, null, 2)}`;
      });
    </script>
  </body>
</html>
